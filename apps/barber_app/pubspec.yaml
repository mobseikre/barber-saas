name: barber_app
description: Hallaqi barber app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  intl: ^0.20.2
  url_launcher: ^6.3.2
  shared:
    path: ../../packages/shared
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  image_picker: ^1.2.3
  qr_flutter: ^4.1.0
  pdf: ^3.12.0
  printing: ^5.14.3
  # image 4.11 needs archive 4.1, which pdf 3.12 does not allow
  image: ">=4.10.1 <4.11.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  test_support:
    path: ../../packages/test_support
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
